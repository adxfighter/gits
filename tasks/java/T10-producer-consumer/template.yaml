code: T10
title: Производитель–потребитель и корректная остановка пула
competencies:
  - java.concurrency.executors
  - java.concurrency.visibility
base_level: middle
description: |
  Конвейер обработки: производители кладут задания в очередь, потребители их обрабатывают.
  Ошибки при остановке: не хватает «ядовитых» элементов для всех потребителей (зависание),
  shutdownNow теряет принятые задания, производитель навсегда блокируется на put после
  остановки, потребитель завершается по isEmpty() и теряет элементы, перехваченное прерывание
  проглатывается. Кандидат обеспечивает остановку без потерь и зависаний.
  Типичные ошибки: остановка по флагу без volatile; poll без таймаута; восстановление прерывания
  забыто.
  Тесты: все принятые до остановки задания обработаны ровно один раз; остановка завершается за
  отведённое время (assertTimeoutPreemptively), потоки конвейера — daemon; поведение при
  нескольких производителях и потребителях.
difficulty_model:
  producers:
    values: [1, 2, 4]
    meaning: число производителей
  consumers:
    values: [1, 2, 4]
    meaning: число потребителей
  bounded_queue:
    values: [false, true]
    meaning: ограничена ли очередь (блокировка производителя на заполненной очереди)
domains:
  - логистика
  - телеком
  - банк
  - энергетика
  - медицина
