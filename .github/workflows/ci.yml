name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the sandbox image used by runner tests
        run: docker build -t gits-sandbox-java:local sandbox/java
      - name: Build and test (Testcontainers uses the GitHub runner's Docker)
        working-directory: backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        name: Detect Angular app
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.app.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image and run hostile-code selftest
        run: bash scripts/sandbox-selftest.sh

  taskbank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Stored validation reports match the task files
        run: |
          (cd backend && mvn -B -q -pl gits-taskbank -am package -DskipTests)
          java -jar backend/gits-taskbank/target/gits-taskbank-exec.jar verify-hashes tasks/java
      # Before re-validation: it rewrites validation.json (run times), the catalog is built from the committed files
      - name: CATALOG.md is generated from the current task files
        run: java -jar backend/gits-taskbank/target/gits-taskbank-exec.jar stats tasks/java --catalog tasks/java/CATALOG.md --check
      - name: Re-validate changed variants in the sandbox
        run: bash scripts/validate-tasks.sh --changed-since origin/${{ github.base_ref || 'main' }}

  images:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build sandbox image
        if: ${{ hashFiles('sandbox/java/Dockerfile') != '' }}
        run: docker build -t gits-sandbox-java:local sandbox/java
      - name: Build compose images
        run: docker compose build
      - name: Smoke test
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8080/api/actuator/health
          curl -fsS http://localhost:8080/ | grep -q GITS
          bash scripts/smoke-auth.sh
          bash scripts/smoke-runner.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  e2e:
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build sandbox image
        run: docker build -t gits-sandbox-java:local sandbox/java
      - name: Start the stack
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E tests
        working-directory: e2e
        run: npx playwright test
      - name: Demo seed on the fresh stack
        run: |
          docker compose --profile tools run --rm --build taskbank demo-seed /seed/demo-sessions
      - name: Demo sessions are in the dashboard
        working-directory: e2e
        env:
          GITS_DEMO_SEEDED: "1"
        run: npx playwright test tests/demo-seed.spec.ts
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 300
