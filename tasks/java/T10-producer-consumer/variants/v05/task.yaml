code: T10-v05
template: T10
kind: task
level: senior
domain: медицина
time_limit_min: 35
difficulty_params:
  producers: 2
  consumers: 2
  bounded_queue: true
editable:
  - src/main/java/ru/gits/task/medicine/t10/LabQueue.java
readonly:
  - src/main/java/ru/gits/task/medicine/t10/Sample.java
  - src/main/java/ru/gits/task/medicine/t10/Analyzer.java
flaky_policy:
  runs: 20
  reference_pass_min: 20
  starter_fail_min: 18
rubric:
  - InterruptedException не проглатывается — потребитель завершается и восстанавливает флаг прерывания
  - Прерванный во время анализа образец возвращается в списке необработанных, а не теряется
  - Обработанные и возвращённые образцы вместе дают все принятые, без повторов
  - Ошибка анализатора на одном образце не останавливает потребителя
