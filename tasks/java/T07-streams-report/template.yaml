code: T07
title: Stream API и Optional в отчёте
competencies:
  - java.streams.api
  - java.testing.boundaries
base_level: junior
description: |
  Отчёт строится конвейером Stream API и содержит ошибки: неверный ключ группировки, сортировка
  в обратном направлении или без учёта равных значений, Optional.get() на пустых данных,
  дубликаты после flatMap, неверное тождество в reduce. Кандидат исправляет конвейер, сохраняя
  формат отчёта.
  Типичные ошибки: замена Optional.get() на orElse(null) с последующим NPE; сортировка без
  вторичного ключа при равенстве; исправление только одной из группировок.
  Тесты: пустые данные, одна запись, равные значения, несколько групп, порядок элементов в
  результате. Детерминированы.
difficulty_model:
  pipeline_ops:
    values: [3, 5, 7]
    meaning: число операций в конвейере
  edge_cases:
    values: [2, 3, 4]
    meaning: число граничных случаев, которые обрабатываются неверно
domains:
  - образование
  - интернет-магазин
  - банк
  - медицина
  - энергетика
