code: T08
title: Асинхронная агрегация на CompletableFuture
competencies:
  - java.concurrency.async
  - java.concurrency.executors
base_level: middle
description: |
  Сервис опрашивает несколько источников асинхронно и объединяет ответы. Ошибки: сбой одного
  источника роняет весь результат, нет таймаута, блокирующие join()/get() внутри цепочки,
  вычисления уходят в общий ForkJoinPool вместо переданного Executor, thenApply вместо
  thenCompose (вложенный CompletableFuture). Кандидат делает агрегацию устойчивой: частичный
  результат или значение по умолчанию, таймаут, использование переданного пула.
  Типичные ошибки: exceptionally на итоговой цепочке вместо каждого источника; таймаут,
  отменяющий уже полученные ответы; get() без таймаута.
  Тесты: источники-заглушки, которые завершаются вручную (CompletableFuture, CountDownLatch) или с
  небольшими задержками на переданном пуле; проверяются частичный результат при сбое, результат
  при таймауте (короткие orTimeout/completeOnTimeout), имя потока исполнителя. Без Thread.sleep
  дольше 200 мс.
difficulty_model:
  sources:
    values: [2, 3, 4]
    meaning: число опрашиваемых источников
  timeouts:
    values: [false, true]
    meaning: требуется ли таймаут на источник
  partial_result:
    values: [false, true]
    meaning: требуется ли частичный результат при сбое части источников
domains:
  - интернет-магазин
  - логистика
  - банк
  - телеком
  - медицина
