spring:
  application:
    name: gits-runner
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://localhost:5432/gits
    username: gits
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is migrated by gits-api; the runner only validates it.
      ddl-auto: validate

gits:
  runner:
    concurrency: ${RUNNER_CONCURRENCY:2}
    sandbox-runtime: ${SANDBOX_RUNTIME:runc}
    sandbox-image: ${SANDBOX_IMAGE:gits-sandbox-java:local}
    heartbeat-ms: 60000
