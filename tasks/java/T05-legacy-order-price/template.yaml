code: T05
title: Рефакторинг унаследованного расчёта стоимости
competencies:
  - java.refactoring.legacy
  - java.basics.conditions
base_level: middle
description: |
  Метод расчёта стоимости (заказа, доставки, счёта) длиной 150–250 строк с дублированием условий
  и одной скрытой ошибкой в редком сочетании правил. Кандидат исправляет ошибку, описанную в
  условии через наблюдаемый симптом, и может упростить код (выделить методы, убрать
  дублирование), сохранив поведение во всех остальных случаях.
  Типичные ошибки: «исправление», меняющее другие ветки; округление в другом месте; потеря
  правила при выделении метода.
  Тесты: видимые — несколько базовых сценариев; скрытые — характеризационные тесты на все
  правила и их сочетания (параметризованные) плюс тест на сценарий с ошибкой. Качество
  рефакторинга оценивается по рубрике ревьюером, тесты проверяют только поведение.
difficulty_model:
  loc:
    values: [150, 200, 250]
    meaning: длина метода расчёта в starter
  cyclomatic:
    values: [15, 25, 35]
    meaning: цикломатическая сложность метода
  rules:
    values: [3, 5, 7]
    meaning: число правил скидок и надбавок
domains:
  - интернет-магазин
  - логистика
  - телеком
  - энергетика
  - банк
