spring:
  application:
    name: gits-api
  datasource:
    # Overridden by SPRING_DATASOURCE_* in docker-compose; defaults target a local `docker compose up postgres`.
    url: jdbc:postgresql://localhost:5432/gits
    username: gits
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  # Trust X-Forwarded-* from the nginx container (private network) to get the real client address.
  forward-headers-strategy: native
  servlet:
    # All endpoints live under /api so the same paths work directly and behind the nginx proxy.
    context-path: /api
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gits:
  public-base-url: ${GITS_PUBLIC_BASE_URL:http://localhost:8080}
  invite-ttl: P7D
  security:
    candidate-secret: ${GITS_CANDIDATE_SECRET:}
    candidate-ttl: PT12H
    secure-cookies: false
    login-per-minute: 10
    enter-per-minute: 20
  demo:
    company-name: Демо-компания
    employer-email: ${DEMO_EMPLOYER_EMAIL:}
    employer-password: ${DEMO_EMPLOYER_PASSWORD:}
    admin-email: ${DEMO_ADMIN_EMAIL:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
  taskbank:
    # Directory with schema/ and java/, mounted read-only into the api container; blank disables loading
    path: ${TASKBANK_PATH:}
    # The format example is not a real task and is never offered to candidates
    excluded-templates: T00
