rubric:
  - hashCode строится только из полей, участвующих в equals
  - Версия этикетки не участвует ни в equals, ни в hashCode, но сохраняется в объекте
  - Трек-номер нормализуется одинаково в equals и hashCode (например, toUpperCase(Locale.ROOT)), сравнение без учёта регистра сохранено
  - Смысл равенства (перевозчик, трек-номер, хаб отправки) не изменён
  - В коде или комментарии видно понимание, почему поле или сравнение в hashCode, не согласованное с equals, ломает поиск в HashMap
