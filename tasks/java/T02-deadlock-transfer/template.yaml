code: T02
title: Взаимная блокировка при переводах между ресурсами
competencies:
  - java.concurrency.locking
  - java.concurrency.atomicity
base_level: middle
description: |
  Операция переводит величину (деньги, товары, мощность) между двумя ресурсами, захватывая их
  блокировки в порядке аргументов. Встречные операции из разных потоков приводят к взаимной
  блокировке. Кандидат устраняет её единым порядком захвата (по идентификатору) или другим
  корректным способом, сохраняя атомарность перевода и инварианты (сумма не меняется, нет
  отрицательных остатков).
  Типичные ошибки: одна глобальная блокировка без обоснования; порядок по hashCode без обработки
  совпадений; tryLock без повторов, теряющий операции; исправление только верхнего метода при
  захвате замков во вложенных вызовах.
  Тесты: встречные переводы из нескольких потоков с общим стартом через CyclicBarrier, ожидание
  завершения не дольше нескольких секунд (assertTimeoutPreemptively), рабочие потоки — daemon,
  чтобы зависшая JVM завершилась. Скрытые тесты проверяют сохранение суммы, отсутствие
  отрицательных остатков, перевод на себя и перевод между тремя и более ресурсами.
difficulty_model:
  resources:
    values: [2, 3, 5]
    meaning: число ресурсов, участвующих во встречных операциях
  call_depth:
    values: [1, 2, 3]
    meaning: глубина вызовов, на которой захватываются блокировки
  nested_locks:
    values: [false, true]
    meaning: захватываются ли блокировки во вложенных методах, а не в одном месте
domains:
  - банк
  - логистика
  - телеком
  - медицина
  - энергетика
