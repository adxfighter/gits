code: CAL
title: Калибровочный блок (не оценивается)
competencies:
  - java.basics.strings
base_level: junior
description: |
  Короткий блок в начале сессии для поведенческого профиля кандидата: скорость и ритм набора,
  паузы, работа с редактором. Не влияет на оценку. Часть 1 — перепечатать фрагмент типичного
  Java-кода из комментария в Reference.java в текстовый блок в Typing.java. Фрагмент хранится в
  комментарии, чтобы на него нельзя было сослаться из кода; копия для сравнения есть только в видимом
  тесте, который сравнивает тексты без учёта пробельных символов. Внутри текстового блока редактор не
  предлагает автодополнение, но может автоматически закрывать скобки — для файлов калибровки это
  отключается в редакторе (P10). Часть 2 — простой метод на 2–3 минуты, три видимых теста, скрытых тестов нет.
  Эталонное решение нужно только для валидатора: проверка «starter проваливает тесты» к блоку
  не применяется.
difficulty_model:
  fragment_lines:
    values: [25, 35]
    meaning: диапазон — число строк фрагмента для перепечатывания
  short_task:
    values: [phone, name, duration]
    meaning: короткая задача части 2
domains:
  - телеком
  - образование
  - логистика
