code: CAL
title: Калибровочный блок (разминка, вес 0,5)
competencies:
  - java.basics.strings
base_level: junior
description: |
  Короткий блок в начале сессии для поведенческого профиля кандидата: скорость и ритм набора,
  паузы, работа с редактором. Не влияет на оценку. Часть 1 — перепечатать целиком фрагмент типичного
  Java-кода из readonly-файла Sample.txt в Typing.txt. Оба файла текстовые: они не компилируются и не
  отправляются в песочницу, поэтому опечатки не мешают части 2. Перепечатку проверяет платформа: совпадение с
  образцом без учёта пробельных символов не менее 95%; вставка из буфера обмена (10 и более непробельных
  символов) отмечается как подозрение на копирование. Автодополнение и автозакрытие скобок в разминке
  отключены (P10). Часть 2 — простой метод на 2–3 минуты, три видимых теста, скрытых тестов нет.
  Эталонное решение нужно только для валидатора: проверка «starter проваливает тесты» к блоку
  не применяется.
difficulty_model:
  fragment_lines:
    values: [25, 35]
    meaning: диапазон — число строк фрагмента для перепечатывания
  short_task:
    values: [phone, name, duration]
    meaning: короткая задача части 2
domains:
  - телеком
  - образование
  - логистика
