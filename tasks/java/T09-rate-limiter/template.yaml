code: T09
title: Ограничитель частоты запросов (token bucket)
competencies:
  - java.concurrency.atomicity
  - java.design.api
base_level: senior
description: |
  Ограничитель частоты по алгоритму token bucket: ёмкость, скорость пополнения, tryAcquire для
  одного или нескольких разрешений, отдельные «вёдра» для ключей. Реализация в starter содержит
  ошибки: целочисленное деление при пополнении, потеря дробных токенов, гонка между проверкой и
  списанием, небезопасная карта вёдер. Кандидат исправляет реализацию. Время внедряется через
  LongSupplier наносекунд, поэтому тесты детерминированы.
  Типичные ошибки: пополнение сверх ёмкости; сброс времени последнего пополнения без учёта
  остатка; synchronized на методе при общей карте вёдер без защиты.
  Тесты: последовательности запросов с управляемыми часами (пополнение, ёмкость, дробные
  интервалы); конкурентный тест — N потоков одновременно запрашивают разрешения при ёмкости C,
  успешных ровно C.
difficulty_model:
  threads:
    values: [1, 4, 8]
    meaning: число потоков в конкурентных тестах
  multi_key:
    values: [false, true]
    meaning: есть ли отдельные вёдра для ключей
  permits:
    values: [single, multiple]
    meaning: запрашивается одно разрешение или несколько
domains:
  - телеком
  - интернет-магазин
  - банк
  - энергетика
  - логистика
