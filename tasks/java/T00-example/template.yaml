code: T00
title: Граничное условие в подсчёте (образец формата)
competencies:
  - java.basics.conditions
  - java.testing.boundaries
base_level: junior
description: |
  Эталон формата банка задач. Кандидат находит и исправляет ошибку граничного условия
  (строгое сравнение вместо нестрогого) в небольшом сервисе статистики. Видимые тесты проверяют
  базовое поведение и не затрагивают границу; скрытые тесты проверяют значение ровно на пороге,
  пустые данные и то, что остальные методы не сломаны исправлением.
difficulty_model:
  defect_type:
    values: [boundary]
    meaning: вид внесённого дефекта
  defects_count:
    values: [1]
    meaning: число дефектов в коде
  loc:
    values: [40, 80]
    meaning: объём кода starter (непустые строки)
domains:
  - образование
