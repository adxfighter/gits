code: T01
title: Состояние гонки в счётчике и агрегаторе
competencies:
  - java.concurrency.atomicity
  - java.concurrency.visibility
base_level: junior
description: |
  Сервис накапливает общее состояние (счётчики, суммы, остатки) из нескольких потоков без
  корректной синхронизации: неатомарный инкремент, составная операция «проверить и изменить»,
  несогласованное обновление нескольких полей. Кандидат делает класс потокобезопасным, не меняя
  публичный API.
  Типичные ошибки кандидата: volatile вместо атомарности; synchronized только на части методов;
  синхронизация на разных объектах; исправление одного поля из двух.
  Тесты: одновременный старт потоков через CountDownLatch или CyclicBarrier, много итераций
  (тысячи операций на поток) и повторение сценария несколько раз внутри теста, проверка инварианта
  (итоговая сумма, отсутствие перепродажи, согласованность полей). Для дефектного кода провал
  воспроизводится в 18+ прогонах из 20. Скрытые тесты проверяют все поля, составные операции и
  чтение агрегата во время записи.
difficulty_model:
  threads:
    values: [4, 8, 16]
    meaning: число потоков в тестах
  shared_fields:
    values: [1, 2, 3]
    meaning: число полей общего состояния, которые должны меняться согласованно
  compound_ops:
    values: [false, true]
    meaning: есть ли составные операции «проверить и изменить» или read-modify-write над коллекцией
  defects_count:
    values: [1, 2]
    meaning: число мест с нарушением атомарности
domains:
  - банк
  - телеком
  - интернет-магазин
  - энергетика
  - образование
