code: T03
title: Утечка памяти в кэше
competencies:
  - java.memory.caching
  - java.design.api
base_level: junior
description: |
  Кэш на HashMap растёт без ограничений: каждое новое значение ключа остаётся в памяти навсегда.
  Кандидат ограничивает ёмкость (LRU через LinkedHashMap с accessOrder и removeEldestEntry или
  собственная реализация), при необходимости добавляет срок жизни записей и сохраняет контракт
  кэша (попадания, промахи, загрузка значения один раз).
  Типичные ошибки: очистка всего кэша при переполнении; insertion-order вместо access-order;
  проверка срока жизни только при записи; утечка через побочную коллекцию статистики.
  Тесты: размер кэша не превышает ёмкость после вставки большого числа ключей; порядок
  вытеснения (недавно использованные записи сохраняются); истечение срока жизни проверяется с
  внедрёнными часами (java.time.Clock), без пауз. Метод size() или аналог входит в публичный API.
difficulty_model:
  eviction:
    values: [capacity, capacity_ttl]
    meaning: требуемая политика вытеснения
  ttl:
    values: [false, true]
    meaning: нужен ли срок жизни записей
  loc:
    values: [60, 120, 180]
    meaning: объём кода starter
domains:
  - интернет-магазин
  - медицина
  - банк
  - логистика
  - телеком
