# Матрица компетенций профиля «Java-разработчик» (v1.0).
# Коды используются в template.yaml (competencies) и в отчёте работодателя.
# Уровни: что ожидается от кандидата на каждом уровне для данной компетенции.
profile: java-developer
competencies:
  java.basics.conditions:
    title: Условия и граничные значения
    junior: Находит ошибки сравнения на границах диапазонов
    middle: Проектирует проверки граничных случаев и тесты для них
    senior: Выявляет классы граничных ошибок в чужом коде при ревью
  java.testing.boundaries:
    title: Тестирование граничных случаев
    junior: Понимает, какие входные данные нужно проверить на границе
    middle: Пишет параметризованные тесты для граничных значений
    senior: Выстраивает стратегию тестирования граничных случаев в команде
  java.concurrency.atomicity:
    title: Атомарность операций над общим состоянием
    junior: Распознаёт неатомарный инкремент и составные операции, применяет synchronized или атомики
    middle: Выбирает между блокировками, атомиками и конкурентными коллекциями
    senior: Обосновывает модель потокобезопасности класса и её стоимость
  java.concurrency.visibility:
    title: Видимость изменений между потоками
    junior: Знает, что изменения без синхронизации могут быть не видны другим потокам
    middle: Применяет volatile, happens-before, безопасную публикацию
    senior: Анализирует модель памяти Java в сложных сценариях
  java.concurrency.locking:
    title: Блокировки и взаимные блокировки
    junior: Понимает причину взаимной блокировки при захвате двух замков
    middle: Устраняет взаимные блокировки упорядочиванием захвата
    senior: Проектирует протоколы блокировок для нескольких ресурсов и вложенных вызовов
  java.concurrency.async:
    title: Асинхронные вычисления (CompletableFuture)
    junior: Понимает разницу между синхронным и асинхронным вызовом
    middle: Строит цепочки CompletableFuture с обработкой ошибок
    senior: Управляет таймаутами, пулами потоков и частичными результатами
  java.concurrency.executors:
    title: Пулы потоков и корректная остановка
    junior: Использует ExecutorService и завершает его
    middle: Организует обмен через ограниченные очереди и корректный shutdown
    senior: Гарантирует отсутствие потерь задач и зависаний при остановке
  java.memory.caching:
    title: Кэширование и ограничение памяти
    junior: Видит неограниченный рост коллекции как утечку памяти
    middle: Реализует кэш с вытеснением (LRU, TTL)
    senior: Выбирает стратегию кэширования под нагрузку и SLA
  java.memory.leaks:
    title: Утечки памяти через ссылки и ThreadLocal
    junior: Понимает, что забытые подписчики удерживают объекты
    middle: Находит утечки через слушателей и ThreadLocal в пулах потоков
    senior: Проектирует API, исключающие утечки по построению
  java.collections.contracts:
    title: Контракты equals/hashCode и коллекции
    junior: Реализует согласованные equals и hashCode
    middle: Понимает последствия изменяемых ключей и наследования для контракта
    senior: Проектирует value-объекты и ключи коллекций
  java.streams.api:
    title: Stream API и Optional
    junior: Пишет простые конвейеры и обрабатывает пустые данные
    middle: Использует группировку, сортировку и коллекторы без ошибок
    senior: Выбирает между стримами и циклами по читаемости и производительности
  java.refactoring.legacy:
    title: Сопровождение и рефакторинг унаследованного кода
    junior: Исправляет ошибку в длинном методе, не ломая остальное
    middle: Выделяет методы и сохраняет поведение, опираясь на тесты
    senior: Планирует поэтапный рефакторинг с характеризационными тестами
  java.design.api:
    title: Проектирование API класса
    junior: Сохраняет публичный контракт при исправлениях
    middle: Проектирует понятные и безопасные публичные методы
    senior: Проектирует расширяемые API с учётом потокобезопасности и тестируемости
  java.basics.strings:
    title: Работа со строками
    junior: Разбирает и нормализует строки стандартными методами String и StringBuilder
    middle: Учитывает Unicode, локаль и граничные случаи входных данных
    senior: Проектирует разбор и валидацию текстовых форматов с понятными ошибками
