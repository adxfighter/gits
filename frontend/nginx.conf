# The invite token in /c/<token> (43 characters) is the candidate's key: the access log masks it, also in Referer;
# the short routes /c/consent, /c/intro… stay as they are
map $request_uri $gits_log_uri {
    "~^/c/[A-Za-z0-9_-]{20,}(?<rest>.*)$" /c/***$rest;
    default $request_uri;
}
map $http_referer $gits_log_referer {
    "~^(?<origin>[^/]*//[^/]+)/c/[A-Za-z0-9_-]{20,}" $origin/c/***;
    default $http_referer;
}
log_format gits '$remote_addr - $remote_user [$time_local] "$request_method $gits_log_uri $server_protocol" '
                '$status $body_bytes_sent "$gits_log_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log gits;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
