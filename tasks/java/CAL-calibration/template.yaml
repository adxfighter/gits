code: CAL
title: Калибровочный блок (не оценивается)
competencies:
  - java.basics.strings
base_level: junior
description: |
  Короткий блок в начале сессии для поведенческого профиля кандидата: скорость и ритм набора,
  паузы, работа с редактором. Не влияет на оценку. Часть 1 — перепечатать фрагмент типичного
  Java-кода из Reference.java в Typing.java (оба фрагмента — текстовые блоки, чтобы автодополнение
  редактора не искажало профиль набора); видимый тест сравнивает тексты без учёта пробельных
  символов. Часть 2 — простой метод на 2–3 минуты, три видимых теста, скрытых тестов нет.
  Эталонное решение нужно только для валидатора: проверка «starter проваливает тесты» к блоку
  не применяется.
difficulty_model:
  fragment_lines:
    values: [25, 30, 35]
    meaning: число строк фрагмента для перепечатывания
  short_task:
    values: [phone, name, duration]
    meaning: короткая задача части 2
domains:
  - телеком
  - образование
  - логистика
