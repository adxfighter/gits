code: T04
title: Утечки через слушателей и ThreadLocal
competencies:
  - java.memory.leaks
  - java.concurrency.executors
base_level: middle
description: |
  Объекты подписываются на события и не отписываются (или отписка удаляет не тот экземпляр
  слушателя); контекст запроса в ThreadLocal не очищается после задачи в пуле потоков и
  «переезжает» в следующую задачу. Кандидат обеспечивает отписку и очистку контекста
  (try/finally, восстановление предыдущего значения), не меняя публичный API.
  Типичные ошибки: отписка новым экземпляром лямбды; remove() вместо восстановления внешнего
  контекста при вложенных вызовах; очистка только в успешной ветке.
  Тесты: число подписчиков после закрытия подписок; однопоточный пул (Executors с одним потоком),
  в котором следующая задача не должна видеть контекст предыдущей, в том числе после исключения;
  вложенные контексты восстанавливаются. Тесты детерминированы.
difficulty_model:
  leak_sources:
    values: [1, 2]
    meaning: число источников утечки (слушатели, ThreadLocal)
  thread_pool:
    values: [false, true]
    meaning: проявляется ли утечка через повторное использование потоков пула
  nested_context:
    values: [false, true]
    meaning: нужно ли восстанавливать внешний контекст при вложенных вызовах
domains:
  - образование
  - интернет-магазин
  - банк
  - телеком
  - медицина
