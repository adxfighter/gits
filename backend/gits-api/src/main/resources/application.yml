spring:
  application:
    name: gits-api
  datasource:
    # Overridden by SPRING_DATASOURCE_* in docker-compose; defaults target a local `docker compose up postgres`.
    url: jdbc:postgresql://localhost:5432/gits
    username: gits
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  # Trust X-Forwarded-* from the nginx container (private network) to get the real client address.
  forward-headers-strategy: native
  servlet:
    # All endpoints live under /api so the same paths work directly and behind the nginx proxy.
    context-path: /api
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gits:
  public-base-url: ${GITS_PUBLIC_BASE_URL:http://localhost:8080}
  invite-ttl: P7D
  security:
    candidate-secret: ${GITS_CANDIDATE_SECRET:}
    candidate-ttl: PT12H
    secure-cookies: false
    login-per-minute: 10
    enter-per-minute: 20
  demo:
    company-name: Демо-компания
    employer-email: ${DEMO_EMPLOYER_EMAIL:}
    employer-password: ${DEMO_EMPLOYER_PASSWORD:}
    admin-email: ${DEMO_ADMIN_EMAIL:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
  taskbank:
    # Directory with schema/ and java/, mounted read-only into the api container; blank disables loading
    path: ${TASKBANK_PATH:}
    # The format example is not a real task and is never offered to candidates
    excluded-templates: T00
  session:
    time-limit: 90m
    runs-per-task: 60
    autosave-interval: 5s
    max-code-bytes: 262144
    recent-sessions: 3
    expiry-check: 30s
  telemetry:
    max-events: 2000
    max-batch-bytes: 262144
  # Experimental rules v1.0 (docs/indicators.md); the R&D version replaces them with machine-learning models
  indicators:
    burst-window: 5s
    idle-pause: 30s
    idle-burst-chars: 150
    idle-burst-window: 20s
    # an insertion this close to the typing frontier still counts as "top to bottom"
    linear-tolerance: 2
    rules:
      - level: RED
        when: ["pasteRatio > 0.5"]
        explanation: Больше половины итогового кода добавлено вставкой.
      - level: RED
        when: ["idleThenBurst >= 2", "focusLossSeconds > 60"]
        explanation: Несколько раз после долгой паузы код появлялся быстрым всплеском, а вкладка при этом надолго покидалась.
      - level: YELLOW
        when: ["pasteRatio > 0.25"]
        explanation: Заметная доля итогового кода добавлена вставкой.
      - level: YELLOW
        when: ["largestPaste > 300"]
        explanation: Была крупная вставка кода (больше 300 символов).
      - level: YELLOW
        when: ["idleThenBurst >= 1"]
        explanation: После долгой паузы код появился быстрым всплеском без вставки.
      - level: YELLOW
        when: ["focusLossSeconds > 120"]
        explanation: Вкладка с задачей надолго покидалась (больше 2 минут в сумме).
      - level: YELLOW
        when: ["burstRelative > 2.5"]
        explanation: Пиковая скорость набора намного выше обычной скорости кандидата, измеренной на разминке.
      - level: YELLOW
        when: ["linearity > 0.9", "typedChars > 300"]
        explanation: Код набран почти строго сверху вниз, без возвратов и правок — похоже на перепечатку готового решения.
      - level: YELLOW
        when: ["telemetryEvents == 0"]
        explanation: По задаче нет данных телеметрии — оценить достоверность нельзя.
  scoring:
    weights:
      JUNIOR: 1.0
      MIDDLE: 1.5
      SENIOR: 2.0
    # finished sessions whose submits are all checked get their indicators and score
    check-interval: 15s
