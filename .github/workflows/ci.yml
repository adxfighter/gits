name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (including Docker-backed tests)
        working-directory: backend
        run: mvn -B verify -Pdocker-tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        name: Detect Angular app
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.app.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --watch=false
          npm run build

  images:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build sandbox image
        if: ${{ hashFiles('sandbox/java/Dockerfile') != '' }}
        run: docker build -t gits-sandbox-java:local sandbox/java
      - name: Build compose images
        run: docker compose build
      - name: Smoke test
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8080/api/actuator/health
          curl -fsS http://localhost:8080/ | grep -q GITS
      - name: Logs on failure
        if: failure()
        run: docker compose logs
